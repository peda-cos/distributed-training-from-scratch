[project]
name = "zero-parameter-sharding-from-scratch"
version = "0.1.0"
description = "ZeRO stage 1 optimizer-state sharding with flat parameter shards, reduce_scatter/allgather, and mixed-precision Adam over CPU gloo."
requires-python = ">=3.14"
dependencies = ["torch==2.15.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore:Failed to initialize NumPy.*:UserWarning"]
